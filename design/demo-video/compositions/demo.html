    (() => {
      const root = document.querySelector('[data-composition-id="demo"]');
      const q = (s) => root.querySelector(s);
      const qa = (s) => root.querySelectorAll(s);
      // later tweens must not stamp their start values at build time (several tweens share one property)
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });

      // camera framings (stage -> frame: frame = scale * stage + x/y)
      const A = { x: -1170, y: -160, scale: 1.5 };   // TV close
      const B = { x: -392, y: -622, scale: 2.6 };    // Mac menu bar, top right
      const C = { x: 15, y: 40, scale: 1 };          // both devices
      const Z = { x: -6140, y: -1950, scale: 5 };    // into the TV picture
      const cam = q("#d-cam");
      const move = (from, to, t, d, ease, blur) => {
        tl.fromTo(cam, { ...from, transformOrigin: "0 0" }, { ...to, transformOrigin: "0 0", duration: d, ease }, t);
        tl.fromTo(cam, { filter: "blur(0px)" }, { filter: `blur(${blur}px)`, duration: d / 2, ease: "power2.in" }, t);
        tl.fromTo(cam, { filter: `blur(${blur}px)` }, { filter: "blur(0px)", duration: d / 2, ease: "power2.out" }, t + d / 2);
      };
      tl.set(cam, { ...A, transformOrigin: "0 0", immediateRender: true }, 0);

      // words: blur in, one after another
      const wordsIn = (sel, t, gap) => tl.fromTo(qa(sel + " .w"), { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: gap }, t);
